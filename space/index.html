<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Growing NCA</title>
    <!-- stlite runs Streamlit in the browser (Pyodide). Pinned so an upstream release can't change the app. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
      mount(
        {
          // Streamlit and numpy come with stlite. The CA runs on numpy; Pyodide has no PyTorch.
          requirements: [],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
            "nca_numpy.py": { url: "./nca_numpy.py" },
            "network_numpy.py": { url: "./network_numpy.py" },
            "chaos_numpy.py": { url: "./chaos_numpy.py" },
            "chaos_presets.json": { url: "./chaos_presets.json" },
            "models/mountain.npz": { url: "./models/mountain.npz" },
            "models/mountain_chaos.npz": { url: "./models/mountain_chaos.npz" },
            "models/texture.npz": { url: "./models/texture.npz" },
            "models/texture_chaos.npz": { url: "./models/texture_chaos.npz" },
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
